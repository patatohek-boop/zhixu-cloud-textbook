<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="pvwork-title pvwork-desc">
<title id="pvwork-title">准平衡膨胀的压力体积图与边界功</title>
<desc id="pvwork-desc">压力为纵轴，体积为横轴。系统从状态一膨胀至状态二，过程曲线下方相对零压轴的阴影面积等于对外边界功，等于压力对体积积分。此曲线为一般示意，不特指等温或绝热。</desc>
<defs>
<marker id="pvwork-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#155f52"/></marker>
<marker id="pvwork-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#266f9b"/></marker>
<marker id="pvwork-o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#bd7148"/></marker>
<marker id="pvwork-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#526760"/></marker>
</defs>
<rect width="640" height="420" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#183f38" stroke-linecap="round" stroke-linejoin="round">

<text x="320" y="34" text-anchor="middle" font-size="22" font-weight="600">准平衡膨胀：曲线下面积是边界功</text>
<path d="M78 336H594" stroke="#526760" stroke-width="2.5" fill="none" marker-end="url(#pvwork-gray)"/>
<path d="M78 336V64" stroke="#526760" stroke-width="2.5" fill="none" marker-end="url(#pvwork-gray)"/>
<text x="52" y="80" font-size="20">p</text><text x="601" y="341" font-size="20">V</text><text x="59" y="359" font-size="16">0</text>
<path d="M148 336V108C245 143 377 234 548 268V336Z" fill="#e1efe8"/>
<path d="M148 108C245 143 377 234 548 268" fill="none" stroke="#155f52" stroke-width="4"/>
<path d="M289.04 173.36C318.27 187.65 349.45 202.38 382.61 216.20" fill="none" stroke="#155f52" stroke-width="3" marker-end="url(#pvwork-g)"/>
<path d="M148 108V336M548 268V336" fill="none" stroke="#526760" stroke-width="1.8" stroke-dasharray="6 6"/>
<path d="M78 108H141M78 268H141" fill="none" stroke="#b6c6bf" stroke-width="1.6" stroke-dasharray="5 6"/>
<circle cx="148" cy="108" r="6" fill="#155f52"/><circle cx="548" cy="268" r="6" fill="#155f52"/>
<text x="135" y="86" font-size="19" fill="#155f52">状态 1</text><text x="530" y="247" font-size="19" fill="#155f52">状态 2</text>
<text x="148" y="365" text-anchor="middle">V₁</text><text x="548" y="365" text-anchor="middle">V₂</text>
<text x="339" y="285" text-anchor="middle" font-size="23" fill="#155f52">W_b = ∫ p dV</text>
<text x="340" y="310" text-anchor="middle" font-size="16" fill="#526760">积分从 V₁ 到 V₂；膨胀时为正</text>
<text x="320" y="404" text-anchor="middle" font-size="16">示意曲线；需准平衡或使用实际边界压力，不代表特定过程</text>
</g></svg>
