<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 722" width="480" height="722" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">信息边界：fit 一次，再应用</title><desc id="desc">训练值10和14用于估计均值12尺度2。相同变换将训练变为负1和1、验证18变为3、测试22变为5。验证用于选择，测试只评价固定方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="722" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">信息边界：fit 一次，再应用</text><text x="24" y="66" font-size="19" fill="#1d5ca5" text-anchor="start" font-weight="700">先划分；只有训练部分进入 fit</text><rect x="24" y="84" width="432" height="77" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="114" font-size="21" fill="#15324a" text-anchor="start" font-weight="700">训练输入：[10, 14]</text><text x="42" y="143" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">计算均值与尺度，分母采用 n = 2</text><path d="M240,167 L240,204" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="191" font-size="18" fill="#1d5ca5" text-anchor="start" font-weight="400">fit</text><rect x="24" y="216" width="432" height="108" rx="12" fill="#e8f6f3" stroke="#9dc8bd"/><text x="42" y="248" font-size="22" fill="#08786b" text-anchor="start" font-weight="700">保存参数：μ = 12，s = 2</text><text x="42" y="285" font-size="21" fill="#15324a" text-anchor="start" font-weight="400">固定变换：z = (x − 12) ÷ 2</text><text x="42" y="312" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">以下三组都使用同一把尺子</text><path d="M240,331 L240,367" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="354" font-size="18" fill="#1d5ca5" text-anchor="start" font-weight="400">transform</text><rect x="24" y="380" width="432" height="74" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="410" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">训练</text><text x="149" y="410" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">[10, 14] → [−1, 1]</text><text x="149" y="438" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">学模型参数</text><rect x="24" y="468" width="432" height="74" rx="12" fill="#fff4df" stroke="#a9bfd6"/><text x="42" y="498" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">验证</text><text x="149" y="498" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">[18] → [3]</text><text x="149" y="526" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">比较方案</text><rect x="24" y="556" width="432" height="74" rx="12" fill="#f9edf0" stroke="#a9bfd6"/><text x="42" y="586" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">测试</text><text x="149" y="586" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">[22] → [5]</text><text x="149" y="614" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">评价固定方案</text><text x="24" y="668" font-size="19" fill="#ac3240" text-anchor="start" font-weight="700">测试没有返回 fit 的箭头</text><text x="24" y="699" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">本图是流程算例，四个数不足以可靠评估</text></g></svg>
