<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">贴壁层与首中心距离</title><desc id="desc">壁面上方网格逐层增长，首层中心距离约为首层厚度一半。几何仅为示意。</desc><rect width="800" height="390" rx="16" fill="#f3f7f5"/><g font-family="sans-serif" fill="#183e38"><text x="35" y="43" font-size="24">先解析近壁梯度，再逐渐放大网格</text><path d="M50 310H750" stroke="#155f52" stroke-width="7"/><g stroke="#8bb9ae" stroke-width="1.5" fill="none"><path d="M50 290H750M50 260H750M50 215H750M50 148H750M50 70H750M50 70V310M150 70V310M250 70V310M350 70V310M450 70V310M550 70V310M650 70V310M750 70V310"/></g><circle cx="200" cy="300" r="5" fill="#c76a21"/><path d="M200 300L300 340H460" stroke="#c76a21" fill="none" stroke-width="2"/><text x="310" y="365" font-size="19">首中心：y₁ ≈ Δn₁/2</text><text x="56" y="343" font-size="19">无滑移壁面</text><rect x="420" y="86" width="307" height="110" rx="8" fill="#fff"/><text x="436" y="116" font-size="18">首层：由 y⁺ 与摩擦速度估计</text><text x="436" y="147" font-size="18">总层厚：覆盖需解析的近壁区</text><text x="436" y="178" font-size="18">增长率：避免尺寸突然跳跃</text></g></svg>
