<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 688" width="480" height="688" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">拟合与新数据：分开算误差</title><desc id="desc">训练点为1和2、2和3、3和5，拟合直线斜率1.5截距三分之一。训练残差分别六分之一、负三分之一、六分之一，训练均方误差十八分之一。新输入4处预测十九除以三，但观测4，残差负七除以三。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="688" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">拟合与新数据：分开算误差</text><text x="24" y="67" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">ŷ = 1.5x + 1/3 · 无量纲教学数据</text><rect x="148" y="84" width="168" height="266" fill="#e8f2fe"/><text x="204" y="106" font-size="16" fill="#1d5ca5" text-anchor="middle" font-weight="400">训练输入区间</text><path d="M64,350 L442,350" fill="none" stroke="#cbd7e3" stroke-width="1"/><text x="52" y="356" font-size="16" fill="#4b6477" text-anchor="end" font-weight="400">0</text><path d="M64,274 L442,274" fill="none" stroke="#cbd7e3" stroke-width="1"/><text x="52" y="280" font-size="16" fill="#4b6477" text-anchor="end" font-weight="400">2</text><path d="M64,198 L442,198" fill="none" stroke="#cbd7e3" stroke-width="1"/><text x="52" y="204" font-size="16" fill="#4b6477" text-anchor="end" font-weight="400">4</text><path d="M64,122 L442,122" fill="none" stroke="#cbd7e3" stroke-width="1"/><text x="52" y="128" font-size="16" fill="#4b6477" text-anchor="end" font-weight="400">6</text><text x="148" y="374" font-size="18" fill="#4b6477" text-anchor="middle" font-weight="400">1</text><text x="232" y="374" font-size="18" fill="#4b6477" text-anchor="middle" font-weight="400">2</text><text x="316" y="374" font-size="18" fill="#4b6477" text-anchor="middle" font-weight="400">3</text><text x="400" y="374" font-size="18" fill="#4b6477" text-anchor="middle" font-weight="400">4</text><path d="M64,350 L448,350" fill="none" stroke="#15324a" stroke-width="2"/><path d="M64,350 L64,78" fill="none" stroke="#15324a" stroke-width="2"/><text x="447" y="374" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">x</text><text x="38" y="83" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">y</text><path d="M64,337.3333333333333 L425.2,92.23333333333335" fill="none" stroke="#1d5ca5" stroke-width="3"/><path d="M148,274 L148,280.33333333333337" fill="none" stroke="#08786b" stroke-width="4"/><circle cx="148" cy="274" r="6" fill="#08786b"/><path d="M232,236 L232,223.33333333333331" fill="none" stroke="#08786b" stroke-width="4"/><circle cx="232" cy="236" r="6" fill="#08786b"/><path d="M316,160 L316,166.33333333333334" fill="none" stroke="#08786b" stroke-width="4"/><circle cx="316" cy="160" r="6" fill="#08786b"/><path d="M400,198 L400,109.33333333333334" fill="none" stroke="#ac3240" stroke-width="3" stroke-dasharray="6 4"/><circle cx="400" cy="198" r="7" fill="#fff" stroke="#ac3240" stroke-width="3"/><circle cx="400" cy="109.33333333333334" r="4" fill="#1d5ca5"/><text x="385" y="123" font-size="16" fill="#1d5ca5" text-anchor="end" font-weight="400">预测 19/3</text><text x="388" y="185" font-size="17" fill="#ac3240" text-anchor="end" font-weight="400">实测 4</text><text x="24" y="410" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">● 训练点      ○ 新观测（未参与拟合）</text><rect x="24" y="429" width="432" height="78" rx="12" fill="#e8f6f3" stroke="#9dc8bd"/><text x="42" y="457" font-size="19" fill="#08786b" text-anchor="start" font-weight="700">训练残差：1/6，−1/3，1/6</text><text x="42" y="487" font-size="19" fill="#15324a" text-anchor="start" font-weight="400">训练 MSE = 1/18 ≈ 0.0556</text><rect x="24" y="522" width="432" height="79" rx="12" fill="#f9edf0" stroke="#dbb0b7"/><text x="42" y="551" font-size="19" fill="#ac3240" text-anchor="start" font-weight="700">新点残差：4 − 19/3 = −7/3</text><text x="42" y="580" font-size="19" fill="#15324a" text-anchor="start" font-weight="400">新点平方损失：49/9 ≈ 5.44</text><text x="24" y="635" font-size="19" fill="#1d5ca5" text-anchor="start" font-weight="700">训练拟合好 ≠ 每个新点都预测好</text><text x="24" y="664" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">单个新点也不足以稳定估计总体风险</text></g></svg>
