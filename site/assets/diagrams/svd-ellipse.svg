<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="svd-ellipse-title svd-ellipse-desc">
<title id="svd-ellipse-title">SVD：圆如何变成椭圆</title><desc id="svd-ellipse-desc">从左到右：旋转后的单位圆，水平半轴二、竖直半轴一的椭圆，再将椭圆逆时针旋转三十度。所有阶段采用相同长度尺度。</desc>
<defs>
<marker id="svd-ellipse-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
<marker id="svd-ellipse-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent,#155f52)"/></marker>
<marker id="svd-ellipse-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--blue,#266f9b)"/></marker>
<marker id="svd-ellipse-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bd7148"/></marker>
</defs>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="27" text-anchor="middle" font-size="20" font-weight="650">SVD：圆如何变成椭圆</text>
<text x="70" y="70" text-anchor="middle">Vᵀ：旋转</text><text x="222" y="70" text-anchor="middle">Σ：伸缩</text><text x="398" y="70" text-anchor="middle">U：旋转</text>
<circle cx="70" cy="151" r="30" fill="var(--blue,#266f9b)" fill-opacity=".08" stroke="var(--blue,#266f9b)" stroke-width="2.4"/>
<g stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity=".3"><line x1="34" y1="151" x2="106" y2="151" /><line x1="70" y1="115" x2="70" y2="187" /></g>
<line x1="70" y1="151" x2="95.980762" y2="166" stroke="var(--blue,#266f9b)" stroke-width="2" marker-end="url(#svd-ellipse-blue)"/>
<line x1="70" y1="151" x2="85" y2="125.019238" stroke="var(--blue,#266f9b)" stroke-width="2" marker-end="url(#svd-ellipse-blue)"/>
<line x1="117" y1="151" x2="151" y2="151" stroke="currentColor" opacity=".6" stroke-width="1.6" marker-end="url(#svd-ellipse-arrow)"/>
<ellipse cx="222" cy="151" rx="60" ry="30" fill="var(--accent,#155f52)" fill-opacity=".09" stroke="var(--accent,#155f52)" stroke-width="2.4"/>
<line x1="162" y1="151" x2="282" y2="151" stroke="var(--accent,#155f52)" opacity=".55" stroke-dasharray="4 4"/>
<line x1="222" y1="121" x2="222" y2="181" stroke="var(--accent,#155f52)" opacity=".55" stroke-dasharray="4 4"/>
<text x="222" y="108" text-anchor="middle">σ₁=2</text>
<text x="222" y="207" text-anchor="middle">σ₂=1</text>
<line x1="293" y1="151" x2="327" y2="151" stroke="currentColor" opacity=".6" stroke-width="1.6" marker-end="url(#svd-ellipse-arrow)"/>
<g transform="rotate(-30 398 151)">
<ellipse cx="398" cy="151" rx="60" ry="30" fill="#bd7148" fill-opacity=".11" stroke="#bd7148" stroke-width="2.4"/>
<line x1="338" y1="151" x2="458" y2="151" stroke="#bd7148" opacity=".65" stroke-dasharray="4 4"/>
<line x1="398" y1="121" x2="398" y2="181" stroke="#bd7148" opacity=".65" stroke-dasharray="4 4"/>
</g>
<text x="70" y="219" text-anchor="middle">圆仍是圆</text>
<text x="398" y="219" text-anchor="middle">再转 30°</text>
<text x="240" y="260" text-anchor="middle">A=UΣVᵀ：正交换方向，奇异值定伸缩</text>
</g></svg>
