<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="calculus-15-title calculus-15-desc">
<title id="calculus-15-title">温度的空间切片和时间切片</title>
<desc id="calculus-15-desc">温度模型为二十加二x加t平方。上图固定两秒，温度沿位置的斜率为二开尔文每米。下图固定一米位置，在两秒处温度对时间的斜率为四开尔文每秒。两幅图的纵轴从不同的非零值开始，横轴不是同一个物理量。</desc>
