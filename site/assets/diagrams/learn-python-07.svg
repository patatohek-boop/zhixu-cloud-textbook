<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 594" width="480" height="594" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">函数：输入、局部计算、返回</title><desc id="desc">20和25按位置绑定到start_c和end_c，内部计算差5并返回，调用处rise接住结果后可以继续加2得到7。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="594" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">函数：输入、局部计算、返回</text><rect x="24" y="62" width="432" height="102" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="93" font-size="20" fill="#15324a" text-anchor="start" font-weight="700">调用者：先开始值，后结束值</text><text x="42" y="131" font-size="21" fill="#1d5ca5" text-anchor="start" font-weight="400">temperature_rise(20, 25)</text><path d="M160,170 L160,208" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><path d="M330,170 L330,208" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="219" width="432" height="142" rx="12" fill="#e8f6f3" stroke="#9dc8bd"/><text x="42" y="250" font-size="20" fill="#15324a" text-anchor="start" font-weight="700">本次调用内部的局部名字</text><text x="42" y="288" font-size="20" fill="#08786b" text-anchor="start" font-weight="400">start_c = 20</text><text x="267" y="288" font-size="20" fill="#08786b" text-anchor="start" font-weight="400">end_c = 25</text><text x="42" y="327" font-size="21" fill="#15324a" text-anchor="start" font-weight="400">difference_c = 25 − 20 = 5</text><path d="M240,366 L240,405" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="391" font-size="18" fill="#1d5ca5" text-anchor="start" font-weight="400">return 5</text><rect x="24" y="417" width="432" height="87" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="449" font-size="21" fill="#15324a" text-anchor="start" font-weight="700">调用处接住：rise = 5</text><text x="42" y="480" font-size="19" fill="#15324a" text-anchor="start" font-weight="400">下一步继续算：rise + 2 → 7</text><text x="24" y="540" font-size="18" fill="#1d5ca5" text-anchor="start" font-weight="700">return 交回对象；print 显示文字</text><text x="24" y="570" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">只有打印、没有返回数值 → 得到 None</text></g></svg>
