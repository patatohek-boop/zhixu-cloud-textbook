<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">固定探头不变，移动质点加速</title><desc id="desc">示意稳态收缩通道。上游速度2米每秒，下游5米每秒。固定探头每秒读到相同速度，而同一标记质点从慢处到快处，产生对流加速度。轮廓只作定性示意。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">固定探头不变，移动质点加速</text><path d="M50 160H170L510 236H594V311H510L170 387H50Z" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><path d="M74 274 L176 274" fill="none" stroke="#266f9b" stroke-width="5" marker-end="url(#blue)"/><path d="M436 274 L581 274" fill="none" stroke="#266f9b" stroke-width="5" marker-end="url(#blue)"/><text x="52" y="129" font-size="25" fill="#266f9b" text-anchor="start" font-weight="normal">上游：u = 2 m/s</text><text x="358" y="201" font-size="25" fill="#266f9b" text-anchor="start" font-weight="normal">下游：u = 5 m/s</text><circle cx="160" cy="274" r="12" fill="#a75125"/><circle cx="480" cy="274" r="12" fill="#a75125"/><path d="M177 282Q320 325 460 282" fill="none" stroke="#a75125" stroke-width="3" stroke-dasharray="8 6"/><text x="320" y="406" font-size="25" fill="#a75125" text-anchor="middle" font-weight="normal">同一质点向快流区运动</text><path d="M316 105 L316 201" fill="none" stroke="#526760" stroke-width="3" marker-end="url(#muted)"/><text x="316" y="90" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">固定探头：读数不随时间变</text><rect x="28" y="423" width="584" height="116" rx="10" fill="#edf4f9"/><text x="320" y="464" font-size="27" fill="#183f38" text-anchor="middle" font-weight="normal">局部项 ∂u/∂t = 0</text><text x="320" y="510" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">质点加速度 u ∂u/∂x 可以 ≠ 0</text></g></svg>