<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 674" width="480" height="674" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">计算图：从预测追到参数变化</title><desc id="desc">零权重使预测为0，预测减目标误差负3，平方损失4.5。梯度是误差乘输入，得到负3负6；学习率0.1更新为0.3和0.6，新损失1.125。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="674" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">计算图：从预测追到参数变化</text><text x="24" y="66" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">一个样本：输入 (1, 2)，目标 y = 3</text><rect x="24" y="84" width="432" height="85" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="112" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">① 加权预测</text><text x="42" y="144" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">ŷ = 1w₁ + 2w₂ = 0</text><path d="M240,173 L240,185" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="194" width="432" height="85" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="222" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">② 平方损失</text><text x="42" y="254" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">e = 0 − 3 = −3；L = e²/2 = 4.5</text><path d="M240,283 L240,295" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="432" height="108" rx="12" fill="#e8f6f3" stroke="#a9bfd6"/><text x="42" y="332" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">③ 链式法则</text><text x="42" y="364" font-size="18" fill="#08786b" text-anchor="start" font-weight="400">∂L/∂w₁ = e × 1 = −3</text><text x="42" y="392" font-size="18" fill="#08786b" text-anchor="start" font-weight="400">∂L/∂w₂ = e × 2 = −6</text><path d="M240,416 L240,430" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="439" width="432" height="108" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="467" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">④ 学习率 η = 0.1</text><text x="42" y="499" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">w新 = (0, 0) − 0.1(−3, −6)</text><text x="42" y="527" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">        = (0.3, 0.6)</text><text x="24" y="586" font-size="20" fill="#1d5ca5" text-anchor="start" font-weight="700">重新预测：0.3 + 2 × 0.6 = 1.5</text><text x="24" y="617" font-size="19" fill="#15324a" text-anchor="start" font-weight="400">新损失 = (1.5 − 3)²/2 = 1.125</text><text x="24" y="650" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">梯度有两个分量，因为有两个参数</text></g></svg>
