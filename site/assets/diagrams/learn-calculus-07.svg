<svg xmlns="http://www.w3.org/2000/svg" width="480" height="375" viewBox="0 0 480 375" role="img" aria-labelledby="calculus-07-title calculus-07-desc">
<title id="calculus-07-title">线性热功率积分的矩形与三角形分解</title>
<desc id="calculus-07-desc">热功率从零秒的一百瓦线性升到五秒的二百瓦。下方矩形面积五百焦耳，上方三角形面积二百五十焦耳，总量七百五十焦耳。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="375" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="32" font-size="24" fill="#f4f7fb" text-anchor="middle" font-weight="bold">功率曲线下方：逐段累计能量</text><text x="240" y="65" font-size="22" fill="#7fe1df" text-anchor="middle" font-weight="normal">q(t)=100+20t，0 ≤ t ≤ 5</text><polygon points="75,290 375,290 375,200 75,200" fill="#7fe1df" fill-opacity="0.19"/><polygon points="75,200 375,200 375,110" fill="#ffce83" fill-opacity="0.26"/><line x1="75" y1="290" x2="429" y2="290" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="75" y1="290" x2="75" y2="83" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="75" y1="200" x2="375" y2="110" stroke="#ffce83" stroke-width="4"/><line x1="75" y1="200" x2="375" y2="200" stroke="#bed0df" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="375" y1="110" x2="375" y2="290" stroke="#bed0df" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="297" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">0</text><text x="60" y="207" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">100</text><text x="60" y="117" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">200</text><text x="75" y="318" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">0</text><text x="375" y="318" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">5</text><text x="32" y="87" font-size="20" fill="#f4f7fb" text-anchor="start" font-weight="normal">q / W</text><text x="432" y="318" font-size="20" fill="#f4f7fb" text-anchor="middle" font-weight="normal">t / s</text><text x="225" y="257" font-size="22" fill="#7fe1df" text-anchor="middle" font-weight="normal">100 × 5 = 500 J</text><text x="286" y="180" font-size="24" fill="#ffce83" text-anchor="middle" font-weight="normal">250 J</text><text x="240" y="352" font-size="23" fill="#f4f7fb" text-anchor="middle" font-weight="bold">总量 = 500 + 250 = 750 J</text>
</g></svg>