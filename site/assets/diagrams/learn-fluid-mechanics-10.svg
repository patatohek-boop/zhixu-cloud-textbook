<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 575" width="640" height="575" role="img" aria-labelledby="title desc"><title id="title">先用连续性，再写机械能账</title><desc id="desc">水平收缩管直径从40毫米变20毫米，面积变为四分之一，给定稳态同密度流量时速度从1变4米每秒。总压差9.462千帕中，加速占7.500千帕，给定损失占1.962千帕，条形宽度按比例绘制。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="575" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">先用连续性，再写机械能账</text><path d="M48 141H207L418 186H590V276H418L207 321H48Z" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><path d="M70 230 L184 230" fill="none" stroke="#266f9b" stroke-width="4" marker-end="url(#blue)"/><path d="M455 230 L572 230" fill="none" stroke="#266f9b" stroke-width="4" marker-end="url(#blue)"/><text x="50" y="113" font-size="25" fill="#183f38" text-anchor="start" font-weight="normal">D₁ = 40 mm</text><text x="403" y="159" font-size="25" fill="#183f38" text-anchor="start" font-weight="normal">D₂ = 20 mm</text><text x="57" y="357" font-size="25" fill="#266f9b" text-anchor="start" font-weight="normal">V₁ = 1 m/s</text><text x="414" y="307" font-size="25" fill="#266f9b" text-anchor="start" font-weight="normal">V₂ = 4 m/s</text><text x="320" y="398" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">压差账单：7.500 + 1.962 = 9.462 kPa</text><rect x="51" y="422" width="420" height="44" rx="0" fill="#266f9b"/><rect x="471" y="422" width="110" height="44" rx="0" fill="#a75125"/><text x="249" y="453" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="normal">加速所需</text><text x="526" y="453" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal">耗散</text><text x="320" y="514" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">同高、无泵、给定流量和损失</text><text x="320" y="550" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">面积 ∝ 直径²，面积不是减半</text></g></svg>