<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">稳态不代表没有传热</title><desc id="desc">同一个350开尔文加热表面，一路对300开尔文空气对流散热5瓦，另一路向300开尔文大辐射环境净辐射散热3.13瓦，稳态输入共8.13瓦。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">稳态不代表没有传热</text><rect x="205" y="150" width="230" height="100" rx="10" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><text x="320" y="191" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">加热表面</text><text x="320" y="231" font-size="27" fill="#183f38" text-anchor="middle" font-weight="normal">Ts = 350 K</text><path d="M320 84 L320 143" fill="none" stroke="#266f9b" stroke-width="5" marker-end="url(#blue)"/><text x="320" y="76" font-size="27" fill="#266f9b" text-anchor="middle" font-weight="normal">输入 8.13 W</text><path d="M250 250V302H148V349" fill="none" stroke="#a75125" stroke-width="4"/><path d="M148 324 L148 351" fill="none" stroke="#a75125" stroke-width="4" marker-end="url(#orange)"/><path d="M390 250V302H493V349" fill="none" stroke="#a75125" stroke-width="4"/><path d="M493 324 L493 351" fill="none" stroke="#a75125" stroke-width="4" marker-end="url(#orange)"/><rect x="25" y="361" width="266" height="110" rx="10" fill="#edf4f9"/><text x="158" y="398" font-size="28" fill="#266f9b" text-anchor="middle" font-weight="600">对流 5.00 W</text><text x="158" y="444" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">空气 T∞ = 300 K</text><rect x="348" y="361" width="267" height="110" rx="10" fill="#fff0e7"/><text x="481" y="398" font-size="28" fill="#a75125" text-anchor="middle" font-weight="600">辐射 3.13 W</text><text x="481" y="444" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">环境 Tsur = 300 K</text><text x="320" y="512" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">同一表面 → 两条并行散热路径</text><text x="320" y="546" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">稳态：输入 = 两条输出之和</text></g></svg>