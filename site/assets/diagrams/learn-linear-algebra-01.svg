<svg xmlns="http://www.w3.org/2000/svg" width="480" height="367" viewBox="0 0 480 367" role="img" aria-labelledby="linear-algebra-01-title linear-algebra-01-desc">
<title id="linear-algebra-01-title">首尾相接的向量加法</title>
<desc id="linear-algebra-01-desc">同尺度横纵坐标中，先从原点向右移动二米到二零，再沿平移后的三倍向量v向右三米向上三米，终点五三。原点到终点的虚线是合位移。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="367" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="31" font-size="24" fill="#f4f7fb" text-anchor="middle" font-weight="bold">把两种基本位移拼成目标</text><line x1="65" y1="275" x2="65" y2="95" stroke="#416078" stroke-width="1"/><line x1="125" y1="275" x2="125" y2="95" stroke="#416078" stroke-width="1"/><line x1="185" y1="275" x2="185" y2="95" stroke="#416078" stroke-width="1"/><line x1="245" y1="275" x2="245" y2="95" stroke="#416078" stroke-width="1"/><line x1="305" y1="275" x2="305" y2="95" stroke="#416078" stroke-width="1"/><line x1="365" y1="275" x2="365" y2="95" stroke="#416078" stroke-width="1"/><line x1="65" y1="275" x2="365" y2="275" stroke="#416078" stroke-width="1"/><line x1="65" y1="215" x2="365" y2="215" stroke="#416078" stroke-width="1"/><line x1="65" y1="155" x2="365" y2="155" stroke="#416078" stroke-width="1"/><line x1="65" y1="95" x2="365" y2="95" stroke="#416078" stroke-width="1"/><line x1="65" y1="275" x2="435" y2="275" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="275" x2="65" y2="65" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="275" x2="365" y2="95" stroke="#7fe1df" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="65" y1="275" x2="185" y2="275" stroke="#ffce83" stroke-width="5" marker-end="url(#arrow)"/><line x1="185" y1="275" x2="365" y2="95" stroke="#a7bcff" stroke-width="5" marker-end="url(#arrow)"/><circle cx="365" cy="95" r="6" fill="#ffce83"/><text x="353" y="76" font-size="23" fill="#ffce83" text-anchor="middle" font-weight="normal">b=(5,3)</text><text x="274" y="215" font-size="23" fill="#a7bcff" text-anchor="start" font-weight="normal">3v=(3,3)</text><text x="125" y="305" font-size="23" fill="#ffce83" text-anchor="middle" font-weight="normal">u=(2,0)</text><text x="49" y="283" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">0</text><text x="49" y="103" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">3</text><text x="367" y="303" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">5</text><text x="402" y="304" font-size="20" fill="#f4f7fb" text-anchor="start" font-weight="normal">x / m</text><text x="24" y="64" font-size="20" fill="#f4f7fb" text-anchor="start" font-weight="normal">y / m</text><text x="240" y="345" font-size="21" fill="#f4f7fb" text-anchor="middle" font-weight="normal">u + 3v = (2,0) + (3,3) = (5,3)</text>
</g></svg>