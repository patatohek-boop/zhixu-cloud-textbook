<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
<title id="title">用线性速度剖面理解位移厚度与动量厚度</title><desc id="desc">纵坐标是离壁高度，横坐标是速度比例。三角形速度亏损面积对应位移厚度，动量厚度还乘速度比例。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#236d89"/></marker></defs>
<rect width="820" height="440" rx="12" fill="#f7fbfc"/>
<g font-family="sans-serif" fill="#173c4a" font-size="19">
<text x="28" y="35" font-size="23" font-weight="bold">同一剖面，两种不同的积分权重</text>
<path d="M80 342L320 102V342Z" fill="#f9e7d3"/><path d="M80 342V102H320Z" fill="#e3f2e9"/>
<g stroke="#236d89" stroke-width="2" marker-end="url(#a)"><path d="M80 342H374"/><path d="M80 354V67"/></g>
<path d="M320 342V69M80 102H320" stroke="#8ca8b3" stroke-dasharray="5 5"/>
<path d="M80 342L320 102V67" stroke="#187964" stroke-width="4" fill="none"/>
<text x="53" y="368">0</text><text x="315" y="368">1</text><text x="349" y="381">u/Uₑ</text><text x="25" y="78">y/δ</text><text x="50" y="108">1</text>
<text x="94" y="164" fill="#187964">实际速度 s</text><text x="216" y="298" fill="#a04b21">亏损 1 − s</text>
<path d="M80 222H200" stroke="#187964" stroke-width="2" marker-end="url(#a)"/>
<path d="M205 222H320" stroke="#bf602d" stroke-width="2" stroke-dasharray="3 3"/>
<g transform="translate(433 108)"><text font-weight="bold">示意剖面：s = y/δ</text><text y="37">0 ≤ s ≤ 1 时，u/Uₑ = s</text><text y="93" font-weight="bold">位移厚度</text><text y="130">积分 (1 − s)：δ* = δ/2</text><text y="185" font-weight="bold">动量厚度</text><text y="222">积分 s(1 − s)：θ = δ/6</text><text y="268">形状因子 H = δ*/θ = 3</text></g>
<text x="28" y="420" font-size="16" fill="#536f7b">此图用于读懂积分定义。线性剖面不是 Blasius 边值问题的精确解。</text>
</g></svg>
