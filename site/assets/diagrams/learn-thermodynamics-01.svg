<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">多一份物质，不等于温度更高</title><desc id="desc">同一均匀状态的复制。左边一份质量0.40千克、体积V0为0.0004立方米、内能100千焦。右边复制两份合看，质量0.80千克、体积2V0、内能200千焦。密度仍1000千克每立方米，比内能仍250千焦每千克。不是抽气或混合过程。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">多一份物质，不等于温度更高</text><text x="320" y="88" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">比较同一均匀状态的理想复制</text><rect x="99" y="150" width="110" height="190" rx="10" fill="#edf4f9" stroke="#266f9b" stroke-width="3"/><text x="154" y="191" font-size="27" fill="#266f9b" text-anchor="middle" font-weight="600">一份</text><text x="154" y="238" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">0.40 kg</text><text x="154" y="284" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">100 kJ</text><text x="154" y="323" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">V₀</text><rect x="362" y="150" width="110" height="190" rx="10" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><rect x="486" y="150" width="110" height="190" rx="10" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><text x="417" y="195" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">同状态</text><text x="417" y="241" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">0.40 kg</text><text x="417" y="282" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">100 kJ</text><text x="417" y="324" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">V₀</text><text x="541" y="195" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">同状态</text><text x="541" y="241" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">0.40 kg</text><text x="541" y="282" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">100 kJ</text><text x="541" y="324" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">V₀</text><path d="M250 241 L341 241" fill="none" stroke="#526760" stroke-width="4" marker-end="url(#muted)"/><text x="295" y="205" font-size="24" fill="#526760" text-anchor="middle" font-weight="normal">复制</text><text x="478" y="378" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">合看：0.80 kg，200 kJ，2V₀</text><rect x="30" y="410" width="580" height="125" rx="10" fill="#f5f7f4"/><text x="320" y="448" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">总量 m、V、U 加倍</text><text x="320" y="490" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">密度仍为 1000 kg/m³</text><text x="320" y="526" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">比内能仍为 250 kJ/kg</text></g></svg>