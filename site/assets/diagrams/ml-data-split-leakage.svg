<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="split-title split-desc">
<title id="split-title">数据划分与防止信息泄露</title>
<desc id="split-desc">三列分别为训练、验证、测试。训练列拟合模型与预处理，再将固定变换提供给验证和测试；验证与测试只使用 transform。交叉验证必须在每个训练折内重新拟合。</desc>
<defs>
<marker id="split-arrow-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker>
<marker id="split-arrow-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker>
<marker id="split-arrow-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bd7148"/></marker>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#203b35;font-size:18px}.title{font-size:22px;font-weight:700}.muted{fill:#586f68}.green{fill:#155f52}.blue{fill:#266f9b}.rust{fill:#bd7148}.strong{font-weight:700}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style>
</defs>
<rect width="480" height="340" rx="12" fill="#ffffff"/>
<rect x="1" y="1" width="478" height="338" rx="11" fill="none" stroke="#dbe5e0"/>

<text x="24" y="36" class="title">划分数据，阻断信息泄露</text>
<text x="24" y="68" class="muted">先按任务选择随机、分组或时间划分</text>
<rect x="18" y="94" width="138" height="103" rx="10" fill="#eaf3ef" stroke="#155f52"/>
<rect x="171" y="94" width="138" height="103" rx="10" fill="#eef5f9" stroke="#266f9b"/>
<rect x="324" y="94" width="138" height="103" rx="10" fill="#faf1ea" stroke="#bd7148"/>
<text x="87" y="123" text-anchor="middle" class="strong green">训练集</text>
<text x="87" y="151" text-anchor="middle">拟合模型</text>
<text x="87" y="180" text-anchor="middle">fit 预处理</text>
<text x="240" y="123" text-anchor="middle" class="strong blue">验证集</text>
<text x="240" y="151" text-anchor="middle">选择方案</text>
<text x="240" y="180" text-anchor="middle">transform</text>
<text x="393" y="123" text-anchor="middle" class="strong rust">测试集</text>
<text x="393" y="151" text-anchor="middle">最终评估</text>
<text x="393" y="180" text-anchor="middle">transform</text>
<path d="M87 198V218" stroke="#155f52" stroke-width="2.5" marker-end="url(#split-arrow-g)"/>
<rect x="18" y="226" width="138" height="43" rx="8" fill="#fff" stroke="#155f52" stroke-width="2"/>
<text x="87" y="254" text-anchor="middle" class="green strong">固定变换</text>
<path d="M157 247H240V201" fill="none" stroke="#155f52" stroke-width="2.5" marker-end="url(#split-arrow-g)"/>
<path d="M240 247H393V201" fill="none" stroke="#155f52" stroke-width="2.5" marker-end="url(#split-arrow-g)"/>
<text x="24" y="302">交叉验证：每折只在训练部分 fit。</text>
<text x="24" y="327" class="muted">测试集不参与调参或选择训练轮数。</text>
</svg>
