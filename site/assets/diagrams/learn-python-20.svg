<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 702" width="480" height="702" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">数组校正：广播与轴的去向</title><desc id="desc">三行两列读数按对应传感器加1与减1，校正后两列都是21、25、29。沿轴0平均留下两列各25，沿轴1平均留下三行21、25、29。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="702" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">数组校正：广播与轴的去向</text><text x="24" y="66" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">轴 0：三个时刻；轴 1：两个传感器</text><rect x="24" y="83" width="432" height="165" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="112" font-size="20" fill="#15324a" text-anchor="start" font-weight="700">原数组 readings · shape (3, 2)</text><text x="242" y="139" font-size="17" fill="#1d5ca5" text-anchor="middle" font-weight="400">传感器 1</text><text x="369" y="139" font-size="17" fill="#08786b" text-anchor="middle" font-weight="400">传感器 2</text><text x="42" y="167" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">时刻 1</text><text x="242" y="167" font-size="21" fill="#1d5ca5" text-anchor="middle" font-weight="400">20</text><text x="369" y="167" font-size="21" fill="#08786b" text-anchor="middle" font-weight="400">22</text><text x="42" y="197" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">时刻 2</text><text x="242" y="197" font-size="21" fill="#1d5ca5" text-anchor="middle" font-weight="400">24</text><text x="369" y="197" font-size="21" fill="#08786b" text-anchor="middle" font-weight="400">26</text><text x="42" y="227" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">时刻 3</text><text x="242" y="227" font-size="21" fill="#1d5ca5" text-anchor="middle" font-weight="400">28</text><text x="369" y="227" font-size="21" fill="#08786b" text-anchor="middle" font-weight="400">30</text><path d="M240,255 L240,302" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="252" y="281" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">每行分别 +1、−1</text><rect x="24" y="313" width="432" height="165" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="342" font-size="20" fill="#15324a" text-anchor="start" font-weight="700">校正数组 corrected · shape (3, 2)</text><text x="242" y="369" font-size="17" fill="#1d5ca5" text-anchor="middle" font-weight="400">传感器 1</text><text x="369" y="369" font-size="17" fill="#08786b" text-anchor="middle" font-weight="400">传感器 2</text><text x="42" y="397" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">时刻 1</text><text x="242" y="397" font-size="21" fill="#1d5ca5" text-anchor="middle" font-weight="400">21</text><text x="369" y="397" font-size="21" fill="#08786b" text-anchor="middle" font-weight="400">21</text><text x="42" y="427" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">时刻 2</text><text x="242" y="427" font-size="21" fill="#1d5ca5" text-anchor="middle" font-weight="400">25</text><text x="369" y="427" font-size="21" fill="#08786b" text-anchor="middle" font-weight="400">25</text><text x="42" y="457" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">时刻 3</text><text x="242" y="457" font-size="21" fill="#1d5ca5" text-anchor="middle" font-weight="400">29</text><text x="369" y="457" font-size="21" fill="#08786b" text-anchor="middle" font-weight="400">29</text><path d="M165,484 L125,515" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><path d="M316,484 L357,515" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="526" width="205" height="116" rx="12" fill="#e8f6f3" stroke="#9dc8bd"/><text x="40" y="555" font-size="18" fill="#08786b" text-anchor="start" font-weight="700">mean(axis=0)</text><text x="40" y="584" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">收起三个时刻</text><text x="40" y="617" font-size="19" fill="#15324a" text-anchor="start" font-weight="400">[25, 25] · (2,)</text><rect x="242" y="526" width="214" height="116" rx="12" fill="#fff4df" stroke="#d7b572"/><text x="258" y="555" font-size="18" fill="#915900" text-anchor="start" font-weight="700">mean(axis=1)</text><text x="258" y="584" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">收起两个传感器</text><text x="258" y="617" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">[21, 25, 29] · (3,)</text><text x="24" y="677" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">形状检查之后，仍要核对每个轴的含义</text></g></svg>
