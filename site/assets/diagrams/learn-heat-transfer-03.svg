<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">热阻较大的一层承担较大温降</title><desc id="desc">横坐标空间位置，从0到3厘米。第一层厚1厘米，温度由60降到55.56摄氏度；第二层厚2厘米，温度降到20摄氏度。热阻分别为0.10和0.80开尔文每瓦，热流均44.44瓦。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">热阻较大的一层承担较大温降</text><rect x="90" y="118" width="155" height="260" rx="0" fill="#edf4f9"/><rect x="245" y="118" width="310" height="260" rx="0" fill="#e8f2ec"/><text x="168" y="91" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">第一层</text><text x="400" y="91" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">第二层</text><path d="M90 390 L593 390" fill="none" stroke="#526760" stroke-width="3" marker-end="url(#muted)"/><path d="M70 390 L70 100" fill="none" stroke="#526760" stroke-width="3" marker-end="url(#muted)"/><text x="28" y="92" font-size="23" fill="#183f38" text-anchor="start" font-weight="normal">T / ℃</text><text x="601" y="421" font-size="26" fill="#183f38" text-anchor="start" font-weight="normal">x</text><text x="87" y="421" font-size="23" fill="#183f38" text-anchor="start" font-weight="normal">0</text><text x="244" y="421" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">1</text><text x="552" y="421" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">3 cm</text><path d="M90 136.0 L245 162.88888862000002 L555 378.0" fill="none" stroke="#a75125" stroke-width="4"/><circle cx="90" cy="136.0" r="6" fill="#a75125"/><circle cx="245" cy="162.888862" r="6" fill="#a75125"/><circle cx="555" cy="378.0" r="6" fill="#a75125"/><text x="103" y="124" font-size="25" fill="#a75125" text-anchor="start" font-weight="normal">60</text><text x="260" y="170" font-size="25" fill="#a75125" text-anchor="start" font-weight="normal">55.56</text><text x="538" y="359" font-size="25" fill="#a75125" text-anchor="start" font-weight="normal">20</text><text x="168" y="285" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">ΔT₁ = 4.44 K</text><text x="400" y="315" font-size="23" fill="#183f38" text-anchor="middle" font-weight="normal">ΔT₂ = 35.56 K</text><rect x="24" y="449" width="592" height="91" rx="10" fill="#f5f7f4"/><text x="320" y="480" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">R₁ = 0.10，R₂ = 0.80 K/W</text><text x="320" y="520" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">两层同一热流率：44.44 W →</text></g></svg>