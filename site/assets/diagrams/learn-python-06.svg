<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 630" width="480" height="630" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">循环账本：数值变，关系不变</title><desc id="desc">有限输入经过三轮筛选，未达标不更新，达标同时更新总和与计数，结束后总和42除以个数2得到21。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="630" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">循环账本：数值变，关系不变</text><text x="24" y="66" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">输入 [18, 20, 22]；只留下 ≥20 的值</text><rect x="24" y="84" width="432" height="82" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="114" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">开始：尚未处理</text><text x="42" y="146" font-size="20" fill="#08786b" text-anchor="start" font-weight="400">total = 0</text><text x="262" y="146" font-size="20" fill="#1d5ca5" text-anchor="start" font-weight="400">count = 0</text><path d="M240,171 L240,193" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="199" width="432" height="82" rx="12" fill="#f1f3f5" stroke="#a9bfd6"/><text x="42" y="229" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">读 18：未达标</text><text x="42" y="261" font-size="20" fill="#08786b" text-anchor="start" font-weight="400">total = 0</text><text x="262" y="261" font-size="20" fill="#1d5ca5" text-anchor="start" font-weight="400">count = 0</text><path d="M240,286 L240,308" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="314" width="432" height="82" rx="12" fill="#e8f6f3" stroke="#a9bfd6"/><text x="42" y="344" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">读 20：达标</text><text x="42" y="376" font-size="20" fill="#08786b" text-anchor="start" font-weight="400">total = 20</text><text x="262" y="376" font-size="20" fill="#1d5ca5" text-anchor="start" font-weight="400">count = 1</text><path d="M240,401 L240,423" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="429" width="432" height="82" rx="12" fill="#e8f6f3" stroke="#a9bfd6"/><text x="42" y="459" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">读 22：达标</text><text x="42" y="491" font-size="20" fill="#08786b" text-anchor="start" font-weight="400">total = 42</text><text x="262" y="491" font-size="20" fill="#1d5ca5" text-anchor="start" font-weight="400">count = 2</text><text x="24" y="546" font-size="21" fill="#08786b" text-anchor="start" font-weight="700">遍历结束，再计算 42 ÷ 2 = 21</text><text x="24" y="578" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">始终记住：已处理且达标的那部分</text><text x="24" y="607" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">每轮 total 和 count 必须描述同一批数据</text></g></svg>
