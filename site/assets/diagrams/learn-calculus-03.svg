<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="calculus-03-title calculus-03-desc">
<title id="calculus-03-title">有限时间窗的平均速度趋近瞬时速度</title>
<desc id="calculus-03-desc">横轴为从两秒出发的时间增量h，纵轴为差商四加h。h等于一、零点一、零点零一时速度分别为五、四点一、四点零一米每秒。零处空心点表示极限，不表示原差商在零有定义。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="360" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="32" font-size="24" fill="#f4f7fb" text-anchor="middle" font-weight="bold">时间窗口缩小，差商靠近极限</text><text x="240" y="65" font-size="22" fill="#7fe1df" text-anchor="middle" font-weight="normal">s(t)=t²，在 t=2 处观察</text><line x1="60" y1="260" x2="425" y2="260" stroke="#416078" stroke-width="2" stroke-dasharray="6 5"/><line x1="60" y1="278" x2="425" y2="278" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="60" y1="278" x2="60" y2="88" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="60" y1="260" x2="390" y2="110" stroke="#7fe1df" stroke-width="3"/><circle cx="390" cy="110" r="6" fill="#ffce83"/><circle cx="93.0" cy="245.0" r="6" fill="#ffce83"/><circle cx="63.3" cy="258.5" r="6" fill="#ffce83"/><circle cx="60" cy="260" r="6" fill="#10283e" stroke="#7fe1df" stroke-width="2"/><text x="43" y="118" font-size="21" fill="#bed0df" text-anchor="end" font-weight="normal">5</text><text x="43" y="267" font-size="21" fill="#bed0df" text-anchor="end" font-weight="normal">4</text><text x="60" y="303" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">0</text><text x="390" y="303" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">1</text><text x="300" y="246" font-size="21" fill="#7fe1df" text-anchor="middle" font-weight="normal">极限：4 m/s</text><text x="387" y="96" font-size="21" fill="#ffce83" text-anchor="middle" font-weight="normal">h=1</text><text x="28" y="90" font-size="20" fill="#f4f7fb" text-anchor="start" font-weight="normal">速度 / (m/s)</text><text x="446" y="305" font-size="20" fill="#f4f7fb" text-anchor="end" font-weight="normal">h / s</text><text x="240" y="341" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">h=0.1 → 4.1；h=0.01 → 4.01</text>
</g></svg>