<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">流固热路与接触温跳</title><desc id="desc">同一稳态热流依次经过固体、接触热阻和流体侧。曲线为热阻模型示意。</desc><rect width="800" height="380" rx="16" fill="#f3f7f5"/><g font-family="sans-serif" fill="#183e38"><text x="32" y="42" font-size="24">同一股热流，分配到不同的温降</text><rect x="65" y="92" width="230" height="178" fill="#e5b99a"/><rect x="295" y="92" width="30" height="178" fill="#b4a0c8"/><rect x="325" y="92" width="410" height="178" fill="#b8d5e9"/><text x="120" y="119" font-size="21">固体导热</text><text x="430" y="119" font-size="21">流体侧换热</text><path d="M80 147L295 175L325 210L710 250" fill="none" stroke="#bd5525" stroke-width="4"/><path d="M110 66H687L673 59M687 66L673 73" fill="none" stroke="#155f52" stroke-width="3"/><text x="280" y="62" font-size="18">稳态热流 q″ →</text><text x="75" y="303" font-size="18">ΔT固体 = q″L/λ</text><text x="475" y="303" font-size="18">ΔT对流 = q″/h</text><path d="M310 210V326" stroke="#8755b1" stroke-dasharray="4 4"/><text x="185" y="352" font-size="18">接触温跳 = q″R″c；示意横距不代表真实厚度</text></g></svg>
