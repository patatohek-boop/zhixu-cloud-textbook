<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">能量先画方向，再写正负号</title><desc id="desc">系统包含气体及内部电阻。电功6.0千焦向右进入，热量1.2千焦向右离开，内能增加4.8千焦。按本课功输出为正，因此电功为负。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">能量先画方向，再写正负号</text><rect x="155" y="142" width="330" height="192" rx="10" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><text x="320" y="184" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">刚性密闭罐</text><text x="320" y="225" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">气体 + 内部电阻</text><text x="320" y="278" font-size="30" fill="#183f38" text-anchor="middle" font-weight="600">ΔU = +4.8 kJ</text><path d="M30 242 L144 242" fill="none" stroke="#266f9b" stroke-width="5" marker-end="url(#blue)"/><text x="28" y="107" font-size="26" fill="#266f9b" text-anchor="start" font-weight="normal">电功输入 6.0 kJ</text><path d="M105 118 L105 210" fill="none" stroke="#266f9b" stroke-width="3" stroke-dasharray="9 7"/><path d="M487 242 L610 242" fill="none" stroke="#a75125" stroke-width="5" marker-end="url(#orange)"/><text x="340" y="372" font-size="26" fill="#a75125" text-anchor="start" font-weight="normal">热流出 1.2 kJ</text><path d="M548 268 L548 341" fill="none" stroke="#a75125" stroke-width="3" stroke-dasharray="9 7"/><text x="320" y="424" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">本课：热进入为正，功输出为正</text><rect x="44" y="449" width="552" height="78" rx="10" fill="#edf4f9"/><text x="320" y="481" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">Q = −1.2 kJ，W = −6.0 kJ</text><text x="320" y="515" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">ΔU = Q − W = +4.8 kJ</text></g></svg>