<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="linear-algebra-02-title linear-algebra-02-desc">
<title id="linear-algebra-02-title">两条线性约束的共同交点</title>
<desc id="linear-algebra-02-desc">直线二x加y等于七与x加y等于五交于二三。第一条纵截距七、横截距三点五，第二条纵横截距都为五。两坐标采用相同数值刻度，消元只把交点读成x等于二、y等于三，不改变满足的解。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="390" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="32" font-size="24" fill="#f4f7fb" text-anchor="middle" font-weight="bold">消元改写约束，交点保持不变</text><text x="240" y="65" font-size="22" fill="#bed0df" text-anchor="middle" font-weight="normal">答案必须同时满足两条等式</text><line x1="65" y1="310" x2="225" y2="310" stroke="#416078" stroke-width="1" stroke-dasharray="4 5"/><text x="52" y="317" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">0</text><line x1="65" y1="214" x2="225" y2="214" stroke="#416078" stroke-width="1" stroke-dasharray="4 5"/><text x="52" y="221" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">3</text><line x1="65" y1="150" x2="225" y2="150" stroke="#416078" stroke-width="1" stroke-dasharray="4 5"/><text x="52" y="157" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">5</text><line x1="65" y1="86" x2="225" y2="86" stroke="#416078" stroke-width="1" stroke-dasharray="4 5"/><text x="52" y="93" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">7</text><line x1="65" y1="310" x2="350" y2="310" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="310" x2="65" y2="76" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="86" x2="177" y2="310" stroke="#7fe1df" stroke-width="4"/><line x1="65" y1="150" x2="225" y2="310" stroke="#a7bcff" stroke-width="4"/><line x1="129" y1="214" x2="129" y2="310" stroke="#ffce83" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="129" cy="214" r="6" fill="#ffce83"/><text x="257" y="120" font-size="23" fill="#7fe1df" text-anchor="start" font-weight="normal">2x+y=7</text><text x="257" y="162" font-size="23" fill="#a7bcff" text-anchor="start" font-weight="normal">x+y=5</text><line x1="140" y1="214" x2="238" y2="226" stroke="#ffce83" stroke-width="1.5"/><text x="250" y="237" font-size="26" fill="#ffce83" text-anchor="start" font-weight="normal">(2,3)</text><text x="255" y="274" font-size="21" fill="#bed0df" text-anchor="start" font-weight="normal">x=2，y=3</text><text x="129" y="337" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">2</text><text x="225" y="337" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">5</text><text x="354" y="338" font-size="22" fill="#bed0df" text-anchor="start" font-weight="normal">x</text><text x="22" y="86" font-size="22" fill="#bed0df" text-anchor="start" font-weight="normal">y</text><text x="240" y="369" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">原等式与消元后的等式有相同解集</text>
</g></svg>