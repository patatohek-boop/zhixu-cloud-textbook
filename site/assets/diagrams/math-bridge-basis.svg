<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" aria-labelledby="title desc"><title id="title">换一把斜尺子：坐标是组合的权重</title><desc id="desc">v1=(1,1), v2=(1,-1)，3v1=(3,3)，加v2到(4,2)。每个坐标单位均为75像素。</desc><rect width="820" height="540" fill="#f8fbfd"/><g font-family="sans-serif"><text x="35" y="37" font-size="27" fill="#233448" text-anchor="start">换一把斜尺子：坐标是组合的权重</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="context-stroke"/></marker></defs><line x1="145.000" y1="85.000" x2="145.000" y2="430.000" stroke="#dce5ee" stroke-width="1" /><text x="145" y="451" font-size="20" fill="#233448" text-anchor="middle">0</text><line x1="220.000" y1="85.000" x2="220.000" y2="430.000" stroke="#dce5ee" stroke-width="1" /><text x="220" y="451" font-size="20" fill="#233448" text-anchor="middle">1</text><line x1="295.000" y1="85.000" x2="295.000" y2="430.000" stroke="#dce5ee" stroke-width="1" /><text x="295" y="451" font-size="20" fill="#233448" text-anchor="middle">2</text><line x1="370.000" y1="85.000" x2="370.000" y2="430.000" stroke="#dce5ee" stroke-width="1" /><text x="370" y="451" font-size="20" fill="#233448" text-anchor="middle">3</text><line x1="445.000" y1="85.000" x2="445.000" y2="430.000" stroke="#dce5ee" stroke-width="1" /><text x="445" y="451" font-size="20" fill="#233448" text-anchor="middle">4</text><line x1="95.000" y1="425.000" x2="502.000" y2="425.000" stroke="#dce5ee" stroke-width="1" /><text x="78" y="432" font-size="20" fill="#233448" text-anchor="end">-1</text><line x1="95.000" y1="350.000" x2="502.000" y2="350.000" stroke="#dce5ee" stroke-width="1" /><text x="78" y="357" font-size="20" fill="#233448" text-anchor="end">0</text><line x1="95.000" y1="275.000" x2="502.000" y2="275.000" stroke="#dce5ee" stroke-width="1" /><text x="78" y="282" font-size="20" fill="#233448" text-anchor="end">1</text><line x1="95.000" y1="200.000" x2="502.000" y2="200.000" stroke="#dce5ee" stroke-width="1" /><text x="78" y="207" font-size="20" fill="#233448" text-anchor="end">2</text><line x1="95.000" y1="125.000" x2="502.000" y2="125.000" stroke="#dce5ee" stroke-width="1" /><text x="78" y="132" font-size="20" fill="#233448" text-anchor="end">3</text><line x1="95.000" y1="350.000" x2="511.000" y2="350.000" stroke="#334155" stroke-width="2" /><line x1="145.000" y1="434.000" x2="145.000" y2="77.000" stroke="#334155" stroke-width="2" /><text x="516" y="357" font-size="21" fill="#233448" text-anchor="start">x</text><text x="155" y="82" font-size="21" fill="#233448" text-anchor="start">y</text><line x1="145.000" y1="350.000" x2="370.000" y2="125.000" stroke="#2a826f" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="145.000" y1="350.000" x2="220.000" y2="425.000" stroke="#bc681b" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="370.000" y1="125.000" x2="445.000" y2="200.000" stroke="#bc681b" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="145.000" y1="350.000" x2="445.000" y2="200.000" stroke="#294f86" stroke-width="4" marker-end="url(#arrow)"/><circle cx="145.000" cy="350.000" r="5" fill="#183c66" data-x="0" data-y="0"/><circle cx="220.000" cy="275.000" r="5" fill="#183c66" data-x="1" data-y="1"/><circle cx="220.000" cy="425.000" r="5" fill="#183c66" data-x="1" data-y="-1"/><circle cx="370.000" cy="125.000" r="5" fill="#183c66" data-x="3" data-y="3"/><circle cx="445.000" cy="200.000" r="5" fill="#183c66" data-x="4" data-y="2"/><text x="208" y="261" font-size="23" fill="#236f60" text-anchor="start">v₁</text><text x="221" y="416" font-size="23" fill="#9c5514" text-anchor="start">v₂</text><text x="323" y="108" font-size="22" fill="#236f60" text-anchor="start">3v₁=(3,3)</text><text x="405" y="257" font-size="22" fill="#294f86" text-anchor="start">(4,2)</text><text x="540" y="174" font-size="23" fill="#233448" text-anchor="start">3v₁ + v₂ = (4,2)</text><text x="540" y="220" font-size="21" fill="#233448" text-anchor="start">斜基坐标：(3,1)</text><text x="540" y="260" font-size="21" fill="#233448" text-anchor="start">标准坐标：(4,2)</text><text x="540" y="308" font-size="23" fill="#294f86" text-anchor="start">同一个目标点</text><text x="35" y="499" font-size="21" fill="#233448" text-anchor="start">横纵坐标统一为 75 像素/单位；移动箭头不改变它的向量</text></g></svg>