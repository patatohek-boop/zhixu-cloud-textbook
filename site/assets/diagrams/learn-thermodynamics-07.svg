<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">稳态：流动仍在继续，存量不变</title><desc id="desc">固定控制体包住热水器与电阻。水以每秒0.050千克从20摄氏度升到30摄氏度，电输入2.20千瓦，向环境散热0.10千瓦，焓增率2.10千瓦。虚线标控制面。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">稳态：流动仍在继续，存量不变</text><rect x="108" y="167" width="424" height="194" rx="10" fill="#e8f2ec" stroke="#155f52" stroke-width="3"/><path d="M86 145H553V384H86Z" fill="none" stroke="#155f52" stroke-width="3" stroke-dasharray="8 6"/><text x="400" y="132" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">虚线：固定控制面</text><text x="320" y="210" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">稳态电热水器</text><path d="M18 268 L169 268" fill="none" stroke="#266f9b" stroke-width="5" marker-end="url(#blue)"/><path d="M470 268 L620 268" fill="none" stroke="#a75125" stroke-width="5" marker-end="url(#orange)"/><text x="320" y="252" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">圈内储能率 = 0</text><text x="320" y="300" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">水流焓增率 2.10 kW</text><text x="18" y="415" font-size="25" fill="#266f9b" text-anchor="start" font-weight="normal">入口 20 ℃</text><text x="410" y="415" font-size="25" fill="#a75125" text-anchor="start" font-weight="normal">出口 30 ℃</text><text x="320" y="457" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">两端质量流率均为 0.050 kg/s</text><path d="M255 65 L255 154" fill="none" stroke="#266f9b" stroke-width="4" marker-end="url(#blue)"/><text x="290" y="83" font-size="25" fill="#266f9b" text-anchor="start" font-weight="normal">电输入 2.20 kW</text><path d="M320 350 L320 405" fill="none" stroke="#a75125" stroke-width="4" marker-end="url(#orange)"/><text x="320" y="503" font-size="25" fill="#a75125" text-anchor="middle" font-weight="normal">向外散热 0.10 kW</text><text x="320" y="539" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">净输入 2.20 − 0.10 = 2.10 kW</text></g></svg>