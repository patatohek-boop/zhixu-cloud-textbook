<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">质量守恒允许控制体存量增加</title><desc id="desc">水箱横截面积0.20平方米，以每分钟6升流入、2升流出，每分钟积累4升。水位每分钟升2厘米，5分钟升10厘米。假定流量恒定且无泄漏或溢流。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">质量守恒允许控制体存量增加</text><path d="M170 158V388H470V158" fill="none" stroke="#155f52" stroke-width="4"/><rect x="172" y="253" width="296" height="133" rx="0" fill="#edf4f9"/><path d="M177 252 L463 252" fill="none" stroke="#266f9b" stroke-width="3"/><path d="M25 191 L227 191" fill="none" stroke="#266f9b" stroke-width="5" marker-end="url(#blue)"/><text x="27" y="129" font-size="27" fill="#266f9b" text-anchor="start" font-weight="normal">流入 6 L/min</text><path d="M445 347 L610 347" fill="none" stroke="#a75125" stroke-width="5" marker-end="url(#orange)"/><text x="412" y="419" font-size="26" fill="#a75125" text-anchor="start" font-weight="normal">流出 2 L/min</text><path d="M305 245 L305 179" fill="none" stroke="#266f9b" stroke-width="4" marker-end="url(#blue)"/><text x="321" y="218" font-size="24" fill="#266f9b" text-anchor="start" font-weight="normal">水位上升</text><text x="321" y="248" font-size="24" fill="#266f9b" text-anchor="start" font-weight="normal">2 cm/min</text><text x="320" y="304" font-size="27" fill="#183f38" text-anchor="middle" font-weight="normal">箱内净增加</text><text x="320" y="346" font-size="32" fill="#183f38" text-anchor="middle" font-weight="600">4 L/min</text><text x="320" y="91" font-size="26" fill="#183f38" text-anchor="middle" font-weight="normal">水箱截面积 At = 0.20 m²</text><rect x="30" y="457" width="580" height="78" rx="10" fill="#e8f2ec"/><text x="320" y="489" font-size="28" fill="#183f38" text-anchor="middle" font-weight="normal">积累 = 流入 − 流出</text><text x="320" y="524" font-size="24" fill="#183f38" text-anchor="middle" font-weight="normal">5 min 增加 20 L，水位升高 10 cm</text></g></svg>