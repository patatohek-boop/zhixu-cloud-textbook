<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc"><title id="title">先算各层质量，再求平均密度</title><desc id="desc">等截面容器上层1升、密度800千克每立方米、质量0.80千克；下层3升、密度1000、质量3千克。图中体积按一比三绘制。总质量3.8千克除总体积0.004立方米得平均950千克每立方米，不能把平均值当各层局部密度。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a75125"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526760"/></marker></defs><rect width="640" height="560" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="42" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">先算各层质量，再求平均密度</text><rect x="40" y="143" width="204" height="70" rx="0" fill="#ffe9d9" stroke="#a75125" stroke-width="3"/><rect x="40" y="213" width="204" height="210" rx="0" fill="#edf4f9" stroke="#266f9b" stroke-width="3"/><text x="142" y="187" font-size="29" fill="#a75125" text-anchor="middle" font-weight="600">1.0 L</text><text x="142" y="330" font-size="29" fill="#266f9b" text-anchor="middle" font-weight="600">3.0 L</text><path d="M248 177 L281 177" fill="none" stroke="#a75125" stroke-width="3" marker-end="url(#orange)"/><text x="300" y="166" font-size="24" fill="#a75125" text-anchor="start" font-weight="normal">ρ₁ = 800 kg/m³</text><text x="300" y="205" font-size="26" fill="#a75125" text-anchor="start" font-weight="normal">m₁ = 0.80 kg</text><path d="M248 317 L281 317" fill="none" stroke="#266f9b" stroke-width="3" marker-end="url(#blue)"/><text x="300" y="302" font-size="24" fill="#266f9b" text-anchor="start" font-weight="normal">ρ₂ = 1000 kg/m³</text><text x="300" y="345" font-size="26" fill="#266f9b" text-anchor="start" font-weight="normal">m₂ = 3.00 kg</text><text x="320" y="90" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">等截面容器：下层体积是上层 3 倍</text><rect x="28" y="454" width="584" height="84" rx="10" fill="#e8f2ec"/><text x="320" y="488" font-size="25" fill="#183f38" text-anchor="middle" font-weight="normal">3.80 kg ÷ 0.0040 m³</text><text x="320" y="526" font-size="28" fill="#183f38" text-anchor="middle" font-weight="600">平均密度 = 950 kg/m³</text></g></svg>