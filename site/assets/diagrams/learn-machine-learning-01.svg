<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">基线：先学一个数，再检查它</title><desc id="desc">训练目标18、20、22决定常数20。锁定规则后在新样本19、23上得到平方误差1和9，MSE为5；测试信息不回流训练。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="610" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">基线：先学一个数，再检查它</text><rect x="24" y="61" width="432" height="96" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="94" font-size="21" fill="#15324a" text-anchor="start" font-weight="700">训练目标：18、20、22 ℃</text><text x="42" y="130" font-size="19" fill="#15324a" text-anchor="start" font-weight="400">由训练数据决定：c = 60 ÷ 3 = 20</text><path d="M240,163 L240,198" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="209" width="432" height="83" rx="12" fill="#e8f6f3" stroke="#9dc8bd"/><text x="42" y="243" font-size="21" fill="#08786b" text-anchor="start" font-weight="700">锁定规则：每次都预测 20 ℃</text><text x="42" y="273" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">不因测试答案而改这个数</text><path d="M240,298 L240,333" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="346" width="432" height="137" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="377" font-size="19" fill="#15324a" text-anchor="start" font-weight="700">两次新实验：只评价已固定规则</text><text x="42" y="410" font-size="18" fill="#4b6477" text-anchor="start" font-weight="400">实测</text><text x="163" y="410" font-size="18" fill="#4b6477" text-anchor="start" font-weight="400">预测</text><text x="284" y="410" font-size="18" fill="#4b6477" text-anchor="start" font-weight="400">误差平方</text><text x="53" y="440" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">19</text><text x="175" y="440" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">20</text><text x="325" y="440" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">1</text><text x="53" y="469" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">23</text><text x="175" y="469" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">20</text><text x="325" y="469" font-size="20" fill="#15324a" text-anchor="start" font-weight="400">9</text><text x="24" y="521" font-size="20" fill="#1d5ca5" text-anchor="start" font-weight="700">新样本 MSE = (1 + 9) ÷ 2 = 5</text><text x="24" y="554" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">训练 MSE = 8 ÷ 3：来自另一批数据</text><text x="24" y="586" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">分数的单位为 ℃²；不是“每次差 5 ℃”</text></g></svg>
