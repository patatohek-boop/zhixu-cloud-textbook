<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="linear-algebra-03-title linear-algebra-03-desc">
<title id="linear-algebra-03-title">矩阵相乘的输入输出接口</title>
<desc id="linear-algebra-03-desc">输入向量二三经二乘二矩阵B变成二五，再经三乘二矩阵A变成十二五二。总作用是AB，三行两列；右边的B先作用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="450" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="31" font-size="22" fill="#f4f7fb" text-anchor="middle" font-weight="bold">两个输入，经过两步得到三个输出</text><rect x="50" y="52" width="380" height="83" rx="12" fill="#ffce83" fill-opacity="0.09" stroke="#ffce83" stroke-width="1.5"/><text x="240" y="80" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">输入：2 项</text><text x="240" y="114" font-size="26" fill="#ffce83" text-anchor="middle" font-weight="normal">x=(2, 3)ᵀ</text><rect x="50" y="181" width="380" height="83" rx="12" fill="#7fe1df" fill-opacity="0.09" stroke="#7fe1df" stroke-width="1.5"/><text x="240" y="209" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">中间量：2 项</text><text x="240" y="243" font-size="26" fill="#7fe1df" text-anchor="middle" font-weight="normal">z=(2, 5)ᵀ</text><rect x="50" y="310" width="380" height="83" rx="12" fill="#a7bcff" fill-opacity="0.09" stroke="#a7bcff" stroke-width="1.5"/><text x="240" y="338" font-size="21" fill="#bed0df" text-anchor="middle" font-weight="normal">输出：3 项</text><text x="240" y="372" font-size="26" fill="#a7bcff" text-anchor="middle" font-weight="normal">y=(12, 5, 2)ᵀ</text><line x1="240" y1="142" x2="240" y2="172" stroke="#7fe1df" stroke-width="3" marker-end="url(#arrow)"/><text x="282" y="164" font-size="23" fill="#7fe1df" text-anchor="start" font-weight="normal">B：2×2</text><line x1="240" y1="271" x2="240" y2="301" stroke="#a7bcff" stroke-width="3" marker-end="url(#arrow)"/><text x="282" y="293" font-size="23" fill="#a7bcff" text-anchor="start" font-weight="normal">A：3×2</text><text x="240" y="431" font-size="24" fill="#f4f7fb" text-anchor="middle" font-weight="bold">总作用：AB，尺寸 3×2</text>
</g></svg>