nt-weight="normal">3</text><text x="136" y="220" font-size="23" fill="#a7bcff" text-anchor="start" font-weight="normal">−2</text><text x="258" y="165" font-size="23" fill="#a7bcff" text-anchor="start" font-weight="normal">0</text><text x="377" y="148" font-size="23" fill="#a7bcff" text-anchor="start" font-weight="normal">+2</text><text x="20" y="92" font-size="20" fill="#f4f7fb" text-anchor="start" font-weight="normal">温升 / K</text><text x="400" y="331" font-size="20" fill="#f4f7fb" text-anchor="middle" font-weight="normal">观测序号</text><text x="225" y="352" font-size="21" fill="#f4f7fb" text-anchor="middle" font-weight="normal">残差平方和：4 + 0 + 4 = 8 K²</text>
