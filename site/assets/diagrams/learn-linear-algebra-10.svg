<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" role="img" aria-labelledby="linear-algebra-10-title linear-algebra-10-desc">
<title id="linear-algebra-10-title">常数预测与三个残差</title>
<desc id="linear-algebra-10-desc">三个观测温升依次为二、四、六开尔文，水平虚线为共同预测四开尔文。从预测指向观测的箭头分别是负二、零、正二开尔文，误差平方和为八平方开尔文。横轴只是观测序号，不是三维投影的空间坐标。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="380" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
