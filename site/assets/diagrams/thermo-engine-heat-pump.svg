<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="engine-title engine-desc">
<title id="engine-title">热机与热泵的能量流向</title>
<desc id="engine-desc">热机从高温热源吸热，向低温热源排热并输出功。热泵输入功，把热从低温热源搬到高温热源。两种装置均满足高温端热量等于低温端热量加功的大小。</desc>
<defs>
<marker id="engine-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#155f52"/></marker>
<marker id="engine-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#266f9b"/></marker>
<marker id="engine-o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#bd7148"/></marker>
<marker id="engine-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#526760"/></marker>
</defs>
<rect width="640" height="440" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#183f38" stroke-linecap="round" stroke-linejoin="round">

<text x="151" y="34" text-anchor="middle" font-size="22" font-weight="600">热机：输出功</text>
<text x="481" y="34" text-anchor="middle" font-size="22" font-weight="600">热泵：输入功</text>
<line x1="320" y1="57" x2="320" y2="386" stroke="#d9e3df" stroke-width="2"/>
<rect x="48" y="56" width="194" height="54" rx="9" fill="#fbefe7" stroke="#bd7148" stroke-width="2"/>
<text x="145" y="89" text-anchor="middle" fill="#914b2e">高温热源 T_H</text>
<rect x="48" y="332" width="194" height="54" rx="9" fill="#edf5fb" stroke="#266f9b" stroke-width="2"/>
<text x="145" y="365" text-anchor="middle" fill="#266f9b">低温热源 T_L</text>
<circle cx="145" cy="216" r="42" fill="#eef6f2" stroke="#155f52" stroke-width="3"/>
<text x="145" y="223" text-anchor="middle">热机</text>
<path d="M145 116V166" stroke="#bd7148" stroke-width="4" fill="none" marker-end="url(#engine-o)"/>
<text x="167" y="150" fill="#bd7148">Q_H</text>
<path d="M145 265V325" stroke="#266f9b" stroke-width="4" fill="none" marker-end="url(#engine-b)"/>
<text x="167" y="301" fill="#266f9b">Q_L</text>
<path d="M194 216H291" stroke="#155f52" stroke-width="4" fill="none" marker-end="url(#engine-g)"/>
<text x="244" y="192" text-anchor="middle" fill="#155f52">W 输出</text>
<rect x="374" y="56" width="194" height="54" rx="9" fill="#fbefe7" stroke="#bd7148" stroke-width="2"/>
<text x="471" y="89" text-anchor="middle" fill="#914b2e">高温热源 T_H</text>
<rect x="374" y="332" width="194" height="54" rx="9" fill="#edf5fb" stroke="#266f9b" stroke-width="2"/>
<text x="471" y="365" text-anchor="middle" fill="#266f9b">低温热源 T_L</text>
<circle cx="471" cy="216" r="42" fill="#eef6f2" stroke="#155f52" stroke-width="3"/>
<text x="471" y="223" text-anchor="middle">热泵</text>
<path d="M471 167V117" stroke="#bd7148" stroke-width="4" fill="none" marker-end="url(#engine-o)"/>
<text x="393" y="150" fill="#bd7148">Q_H</text>
<path d="M471 325V265" stroke="#266f9b" stroke-width="4" fill="none" marker-end="url(#engine-b)"/>
<text x="393" y="301" fill="#266f9b">Q_L</text>
<path d="M615 216H521" stroke="#155f52" stroke-width="4" fill="none" marker-end="url(#engine-g)"/>
<text x="570" y="192" text-anchor="middle" fill="#155f52">W 输入</text>
<text x="320" y="421" text-anchor="middle" font-size="18">均按正值大小记：Q_H = Q_L + W</text>
</g></svg>
