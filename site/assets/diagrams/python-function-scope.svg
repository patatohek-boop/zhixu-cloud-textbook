<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="scope-title scope-desc">
<title id="scope-title">函数调用与局部作用域</title>
<desc id="scope-desc">左侧外部作用域包含 t 等于二十五；调用函数时，数值二十五绑定为右侧局部名字 c。函数返回二百九十八点一五，外部把返回值绑定为 result。</desc>
<defs>
<marker id="scope-arrow-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#155f52"/></marker>
<marker id="scope-arrow-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#266f9b"/></marker>
<marker id="scope-arrow-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bd7148"/></marker>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#203b35;font-size:18px}.title{font-size:22px;font-weight:700}.muted{fill:#586f68}.green{fill:#155f52}.blue{fill:#266f9b}.rust{fill:#bd7148}.strong{font-weight:700}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style>
</defs>
<rect width="480" height="320" rx="12" fill="#ffffff"/>
<rect x="1" y="1" width="478" height="318" rx="11" fill="none" stroke="#dbe5e0"/>

<text x="24" y="36" class="title">函数调用：局部名字与返回值</text>
<text x="24" y="68" class="muted mono">result = to_kelvin(t)</text>
<rect x="22" y="97" width="174" height="154" rx="12" fill="#eaf3ef" stroke="#155f52"/>
<rect x="284" y="97" width="174" height="154" rx="12" fill="#eef5f9" stroke="#266f9b"/>
<text x="109" y="125" text-anchor="middle" class="strong green">外部作用域</text>
<text x="371" y="125" text-anchor="middle" class="strong blue">函数局部作用域</text>
<text x="39" y="165" class="mono">t = 25</text>
<text x="305" y="165" class="mono">c = 25</text>
<path d="M198 162H281" stroke="#155f52" stroke-width="2.5" marker-end="url(#scope-arrow-g)"/>
<text x="240" y="150" text-anchor="middle" class="green">25</text>
<text x="300" y="194" class="mono">return</text>
<text x="300" y="220" class="mono">c + 273.15</text>
<path d="M282 224H199" stroke="#266f9b" stroke-width="2.5" marker-end="url(#scope-arrow-b)"/>
<text x="240" y="211" text-anchor="middle" class="blue">298.15</text>
<text x="39" y="208" class="mono">result =</text>
<text x="39" y="236" class="mono">298.15</text>
<text x="24" y="285">局部 c 不会把外部 t 重新绑定。</text>
<text x="24" y="309" class="muted">传入可变对象时，仍需留意共享修改。</text>
</svg>
