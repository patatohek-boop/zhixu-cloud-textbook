<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 598" width="480" height="598" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">三行代码的执行路线</title><desc id="desc">保存文本、启动运行、读取旧绑定计算并重新绑定、输出当前值。箭头表示执行先后，输出30。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5ca5"/></marker></defs>
<rect width="480" height="598" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="36" font-size="22" fill="#15324a" text-anchor="start" font-weight="700">三行代码的执行路线</text><rect x="24" y="58" width="432" height="88" rx="12" fill="#edf5ff" stroke="#a9bfd6"/><text x="42" y="87" font-size="20" fill="#15324a" text-anchor="start" font-weight="700">① 保存脚本文本</text><text x="42" y="117" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">编辑器负责写与保存，尚未计算</text><path d="M240,150 L240,185" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="172" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">启动解释器</text><rect x="24" y="195" width="432" height="187" rx="12" fill="#e8f6f3" stroke="#9dc8bd"/><text x="42" y="226" font-size="20" fill="#15324a" text-anchor="start" font-weight="700">② 一次运行：从第一行开始</text><text x="42" y="260" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">temp_c = 24</text><text x="264" y="260" font-size="18" fill="#08786b" text-anchor="start" font-weight="400">名字 → 24</text><text x="42" y="299" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">temp_c + 6</text><text x="264" y="299" font-size="18" fill="#08786b" text-anchor="start" font-weight="400">读旧值：24 + 6</text><text x="42" y="338" font-size="18" fill="#15324a" text-anchor="start" font-weight="400">赋值完成</text><text x="264" y="338" font-size="18" fill="#08786b" text-anchor="start" font-weight="400">名字 → 30</text><text x="42" y="366" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">先计算右边，再更新左边的名字</text><path d="M240,387 L240,422" fill="none" stroke="#1d5ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="257" y="409" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">print(temp_c)</text><rect x="24" y="432" width="432" height="79" rx="12" fill="#fff4df" stroke="#d7b572"/><text x="42" y="464" font-size="22" fill="#915900" text-anchor="start" font-weight="700">③ 屏幕输出：30</text><text x="42" y="493" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">显示的是执行到 print 时的值</text><text x="24" y="548" font-size="19" fill="#1d5ca5" text-anchor="start" font-weight="700">修改文本 → 保存 → 重新运行</text><text x="24" y="577" font-size="17" fill="#15324a" text-anchor="start" font-weight="400">旧屏幕结果不会因保存而自动更新</text></g></svg>
