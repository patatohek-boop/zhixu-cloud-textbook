<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="calculus-01-title calculus-01-desc">
<title id="calculus-01-title">温度函数的输入输出与有效区间</title>
<desc id="calculus-01-desc">横轴时间零到十分钟，纵轴温度二十到五十摄氏度。直线经过零分钟二十度、四分钟三十二度、十分钟五十度，超过十分钟没有画延长线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bed0df"/></marker></defs>
<rect width="480" height="360" rx="10" fill="#10283e"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="240" y="32" font-size="24" fill="#f4f7fb" text-anchor="middle" font-weight="bold">先检查输入范围，再计算输出</text><text x="240" y="65" font-size="22" fill="#7fe1df" text-anchor="middle" font-weight="normal">T = 20 + 3t，0 ≤ t ≤ 10</text><line x1="70" y1="280" x2="70" y2="280" stroke="#416078" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="70" y1="280" x2="70" y2="280" stroke="#416078" stroke-width="1.5" stroke-dasharray="4 5"/><text x="57" y="287" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">20</text><text x="70" y="307" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">0</text><line x1="70" y1="220" x2="194" y2="220" stroke="#416078" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="194" y1="220" x2="194" y2="280" stroke="#416078" stroke-width="1.5" stroke-dasharray="4 5"/><text x="57" y="227" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">32</text><text x="194" y="307" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">4</text><line x1="70" y1="130" x2="380" y2="130" stroke="#416078" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="380" y1="130" x2="380" y2="280" stroke="#416078" stroke-width="1.5" stroke-dasharray="4 5"/><text x="57" y="137" font-size="20" fill="#bed0df" text-anchor="end" font-weight="normal">50</text><text x="380" y="307" font-size="20" fill="#bed0df" text-anchor="middle" font-weight="normal">10</text><line x1="70" y1="280" x2="415" y2="280" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="70" y1="280" x2="70" y2="105" stroke="#bed0df" stroke-width="2" marker-end="url(#arrow)"/><line x1="70" y1="280" x2="380" y2="130" stroke="#7fe1df" stroke-width="4"/><circle cx="70" cy="280" r="6" fill="#ffce83"/><circle cx="194" cy="220" r="6" fill="#ffce83"/><circle cx="380" cy="130" r="6" fill="#ffce83"/><text x="193" y="203" font-size="22" fill="#ffce83" text-anchor="start" font-weight="normal">(4, 32)</text><text x="35" y="95" font-size="20" fill="#f4f7fb" text-anchor="start" font-weight="normal">T / °C</text><text x="388" y="335" font-size="20" fill="#f4f7fb" text-anchor="middle" font-weight="normal">t / min</text><text x="24" y="341" font-size="20" fill="#bed0df" text-anchor="start" font-weight="normal">纵轴从 20 开始</text>
</g></svg>