name: Build Android textbook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'site/**'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate textbook
        run: |
          python tools/build.py
          node tools/validate.cjs
          node tools/test-learning-state.cjs
          python tools/security_check.py
      - name: Prepare Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Compile and lint
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - name: Collect unsigned release and verification tools
        run: |
          mkdir -p work/android-artifact
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk work/android-artifact/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" work/android-artifact/
          cp android/app/build/outputs/apk/debug/app-debug.apk work/android-artifact/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk work/android-artifact/
          git rev-parse HEAD > work/android-artifact/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned
          path: work/android-artifact/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 14
      - name: Enable hardware acceleration for emulator tests
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Prepare emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name zhixu-test --package 'system-images;android-35;google_apis;x86_64'
      - name: Verify offline app on Android 15
        timeout-minutes: 10
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd zhixu-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > work/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82
          adb install android/app/build/outputs/apk/debug/app-debug.apk
          adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w app.zhixu.textbook.test/app.zhixu.textbook.TextbookSmokeTest | tee work/android-smoke.txt
          grep -q ZHIXU_SMOKE_SUCCESS work/android-smoke.txt
          adb shell am start -n app.zhixu.textbook/.MainActivity
          sleep 3
          adb exec-out screencap -p > work/android-smoke.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-smoke
          path: |
            work/android-smoke.txt
            work/android-smoke.png
            work/emulator.log
          retention-days: 14
