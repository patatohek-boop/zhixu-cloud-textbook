name: Verify independent Android edition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'downloads/**'
      - 'android/**'
      - 'site/**'
      - 'content/**'
      - 'reviews/learning-*'
      - 'tools/**'
      - '.github/workflows/android-independent.yml'
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'android/**'
      - 'site/**'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/android-independent.yml'
permissions:
  contents: read
concurrency:
  group: android-independent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate textbook
        run: |
          python tools/build.py
          node tools/validate.cjs
          node tools/test-learning-state.cjs
          node tools/test-research-labs.cjs
          node tools/test-cfd-labs.cjs
          node tools/test-foundation-labs.cjs
          node tools/test-concept-stories.cjs
          node tools/test-knowledge-map.cjs
          node tools/test-mastery-exercises.cjs
          python tools/verify_final_review.py
          python tools/verify_report_revision.py
          python tools/verify_thermal_cases.py
          python tools/revision/verify_fluid.py
          python tools/test-learning-preservation.py
          python tools/test-offline-learning.py
          python tools/verify_cfd.py
          python tools/verify_research_foundations.py
          python tools/verify_fluid.py
          python tools/verify_thermal.py
          python tools/security_check.py
      - name: Prepare Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDK_MANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build preserved legacy test app
        working-directory: android
        run: |
          bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p ../work/legacy
          cp app/build/outputs/apk/debug/app-debug.apk ../work/legacy/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../work/legacy/
      - name: Compile and lint independent edition
        working-directory: android
        run: bash gradlew --no-daemon -Pindependent=true :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - name: Collect unsigned release and verification tools
        run: |
          mkdir -p work/android-artifact
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk work/android-artifact/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" work/android-artifact/
          cp android/app/build/outputs/apk/debug/app-debug.apk work/android-artifact/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk work/android-artifact/
          git rev-parse HEAD > work/android-artifact/source-commit.txt
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > work/android-artifact/candidate-commit.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk > work/android-artifact/apk-metadata.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions android/app/build/outputs/apk/release/app-release-unsigned.apk > work/android-artifact/apk-permissions.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-unsigned
          path: work/android-artifact/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-reports
          path: android/app/build/reports/
          retention-days: 14
      - name: Sign test-only release with ephemeral CI identity
        run: |
          # This is a test certificate generated by Gradle, never the publication key.
          bash android/gradlew -p android --no-daemon -Pindependent=true :app:signingReport --console plain > work/test-signing-report.txt
          DEBUG_KEY=$(sed -n 's/^Store: //p' work/test-signing-report.txt | head -1)
          test -f "$DEBUG_KEY"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$DEBUG_KEY" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out work/independent-ci-release.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable hardware acceleration for emulator tests
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Prepare emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/zhixu-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force --name zhixu-test --device pixel_2 --path "$ANDROID_AVD_HOME/zhixu-test.avd" --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x zhixu-test
      - name: Verify offline app on Android 15
        timeout-minutes: 10
        run: |
          collect_diagnostics() {
            timeout 15 adb logcat -d > work/android-logcat.txt 2>&1 || true
            timeout 10 adb exec-out screencap -p > work/android-final-screen.png || true
            timeout 10 adb shell dumpsys window > work/android-window.txt || true
            for name in concept-toc-screen concept-position-failure-screen; do
              if timeout 5 adb shell test -f "/data/data/app.zhixu.textbook.independent/files/$name.png"; then
                timeout 5 adb exec-out cat "/data/data/app.zhixu.textbook.independent/files/$name.png" > "work/android-$name.png" || true
              fi
            done
            tail -60 work/emulator.log || true
          }
          trap collect_diagnostics EXIT
          "$ANDROID_HOME/emulator/emulator" -avd zhixu-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -camera-back none -camera-front none > work/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb root
          adb wait-for-device
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell input keyevent 82
          adb install work/legacy/app-debug.apk
          adb install work/legacy/app-debug-androidTest.apk
          adb install work/independent-ci-release.apk
          adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # The fresh Google APIs image can display a Pixel Launcher ANR after boot.
          # Stop only that emulator launcher before testing; keep application failures visible.
          adb shell am force-stop com.google.android.apps.nexuslauncher
          timeout 240 adb shell am instrument -w -e expectRelease true app.zhixu.textbook.independent.test/app.zhixu.textbook.TextbookSmokeTest | tee work/android-smoke.txt
          grep -q ZHIXU_SMOKE_SUCCESS work/android-smoke.txt
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/reader-screen.png > work/android-reader.png
          test -s work/android-reader.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/concept-screen.png > work/android-concepts.png
          test -s work/android-concepts.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/research-screen.png > work/android-research.png
          test -s work/android-research.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/simulation-screen.png > work/android-simulation.png
          test -s work/android-simulation.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/knowledge-map-screen.png > work/android-knowledge-map.png
          test -s work/android-knowledge-map.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/concept-story-screen.png > work/android-concept-story.png
          test -s work/android-concept-story.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/mastery-practice-screen.png > work/android-mastery-practice.png
          test -s work/android-mastery-practice.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/horizontal-formula-screen.png > work/android-horizontal-formula.png
          test -s work/android-horizontal-formula.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/core-continuation-screen.png > work/android-core-continuation.png
          test -s work/android-core-continuation.png
          adb exec-out cat /data/data/app.zhixu.textbook.independent/files/report-revision-screen.png > work/android-report-revision.png
          test -s work/android-report-revision.png
          adb shell am start -W -n app.zhixu.textbook.independent/app.zhixu.textbook.MainActivity
          sleep 15
          adb exec-out screencap -p > work/android-home.png
          probe() {
            timeout 90 adb shell am instrument -w -e migrationAction "$2" "$1.test/app.zhixu.textbook.TextbookSmokeTest" | tee -a work/android-migration.txt
            tail -10 work/android-migration.txt | grep -q "ZHIXU_MIGRATION_SUCCESS $2 $1"
          }
          # Discard only synthetic smoke state before first-launch migration checks.
          adb shell pm clear app.zhixu.textbook.independent
          probe app.zhixu.textbook seed
          probe app.zhixu.textbook.independent empty
          adb exec-out cat /data/data/app.zhixu.textbook/files/migration-export.json > work/synthetic-legacy-backup.json
          adb push work/synthetic-legacy-backup.json /data/data/app.zhixu.textbook.independent/files/migration-input.json
          adb shell chmod 644 /data/data/app.zhixu.textbook.independent/files/migration-input.json
          probe app.zhixu.textbook.independent import
          probe app.zhixu.textbook source
          probe app.zhixu.textbook.independent destination
          adb shell dumpsys package app.zhixu.textbook.independent > work/independent-package-runtime.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-smoke
          path: |
            work/android-migration.txt
            work/synthetic-legacy-backup.json
            work/independent-package-runtime.txt
            work/android-smoke.txt
            work/android-reader.png
            work/android-concepts.png
            work/android-concept-toc-screen.png
            work/android-concept-position-failure-screen.png
            work/android-research.png
            work/android-simulation.png
            work/android-knowledge-map.png
            work/android-concept-story.png
            work/android-mastery-practice.png
            work/android-horizontal-formula.png
            work/android-core-continuation.png
            work/android-report-revision.png
            work/android-home.png
            work/emulator.log
            work/android-logcat.txt
            work/android-final-screen.png
            work/android-window.txt
          retention-days: 14
      - name: Verify exact production-signed APK through public UI
        if: hashFiles('downloads/Zhixu-Independent-1.5.0.apk') != ''
        timeout-minutes: 15
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs downloads/Zhixu-Independent-1.5.0.apk | tee work/production-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: $(cat downloads/certificate-sha256.txt)" work/production-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging downloads/Zhixu-Independent-1.5.0.apk > work/production-metadata.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions downloads/Zhixu-Independent-1.5.0.apk > work/production-permissions.txt
          python tools/verify-independent-apk.py --apk downloads/Zhixu-Independent-1.5.0.apk --metadata work/production-metadata.txt --permissions work/production-permissions.txt > work/production-payload.json
          python tools/test-signed-android-ui.py downloads/Zhixu-Independent-1.5.0.apk | tee work/production-ui-result.txt
          grep -q ZHIXU_SIGNED_RELEASE_UI_SUCCESS work/production-ui-result.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-signed-ui
          path: |
            work/signed-release-ui/
            work/production-signature.txt
            work/production-metadata.txt
            work/production-permissions.txt
            work/production-payload.json
            work/production-ui-result.txt
          retention-days: 14
