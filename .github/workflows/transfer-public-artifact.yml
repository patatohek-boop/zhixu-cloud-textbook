name: Inspect verified public web screenshots
on:
  push:
    branches: ['release-transfer/zhixu-1.6.0']
    paths: ['.github/workflows/transfer-public-artifact.yml']
permissions:
  actions: read
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        chunk: [0]
    steps:
      - name: Emit selected public browser screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.chunk }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error, io, zipfile, hashlib, base64, json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          api='https://api.github.com/repos/patatohek-boop/zhixu-cloud-textbook/actions/artifacts/11288962719/zip'
          req=urllib.request.Request(api,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              urllib.request.build_opener(NoRedirect()).open(req,timeout=30)
              raise RuntimeError('Expected temporary artifact redirect')
          except urllib.error.HTTPError as error:
              assert error.code == 302
              location=error.headers['Location']
          assert location.startswith('https://')
          raw=urllib.request.urlopen(location,timeout=60).read()
          assert hashlib.sha256(raw).hexdigest()=='799ccb0ed8fef44fd62b8b37c12b482a0eed40a3d6ee6f00ff62cce89d1ded91'
          archive=zipfile.ZipFile(io.BytesIO(raw))
          names=archive.namelist()
          print('ZHIXU_SCREENSHOT_NAMES '+json.dumps(names))
          selected=[n for n in names if n.endswith('reader-continuous.png') and ('width-390' in n or 'width-1440' in n)]
          assert len(selected)==2, selected
          for index,name in enumerate(selected):
              payload=archive.read(name)
              print('ZHIXU_IMAGE_META '+json.dumps({'part':index,'name':name,'sha256':hashlib.sha256(payload).hexdigest(),'bytes':len(payload)}))
              encoded=base64.b64encode(payload).decode()
              for offset in range(0,len(encoded),8192):
                  print('ZHIXU_IMAGE_DATA '+str(index)+' '+encoded[offset:offset+8192])
              print('ZHIXU_IMAGE_END '+str(index))
          PY
